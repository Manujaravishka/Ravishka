name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: portfolio

      - name: Build with GITHUB_PAGES
        run: npm run build
        working-directory: portfolio
        env:
          GITHUB_PAGES: true
          NEXT_PUBLIC_BASE_PATH: /Ravishka

      - name: Copy CNAME for custom domain
        run: cp ../CNAME out/
        working-directory: portfolio

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
